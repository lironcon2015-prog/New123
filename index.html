<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GymPro Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ui-week" class="screen active">
        <h1>GymPro Tracker</h1>
        <div class="week-selector">
            <button class="btn btn-outline" onclick="selectWeek(1)">שבוע 1</button>
            <button class="btn btn-outline" onclick="selectWeek(2)">שבוע 2</button>
            <button class="btn btn-outline" onclick="selectWeek(3)">שבוע 3</button>
            <button class="btn btn-outline" onclick="selectWeek(4)">שבוע 4</button>
        </div>
        
        <div class="archive-access">
            <button class="btn btn-secondary" onclick="openHistory()">📜 ארכיון אימונים</button>
        </div>
    </div>

    <div id="ui-workout" class="screen">
        <div class="header-nav">
            <button class="btn-icon" onclick="goBack()">➜</button>
            <h2 id="week-title">שבוע X</h2>
        </div>
        <div class="workout-list">
            <button class="btn btn-workout" onclick="selectWorkout('A')">אימון A (חזה/גב)</button>
            <button class="btn btn-workout" onclick="selectWorkout('B')">אימון B (רגליים)</button>
            <button class="btn btn-workout" onclick="selectWorkout('C')">אימון C (כתפיים)</button>
            <button class="btn btn-workout" onclick="selectWorkout('arms')">אימון ידיים</button>
        </div>
    </div>

    <div id="ui-arms-select" class="screen">
        <div class="header-nav">
            <button class="btn-icon" onclick="goBack()">➜</button>
            <h2>סדר אימון ידיים</h2>
        </div>
        <div class="center-content">
            <p>מה תרצה להתחיל?</p>
            <button class="btn btn-main" onclick="startArms('biceps')">יד קדמית (Biceps)</button>
            <div style="height: 20px;"></div>
            <button class="btn btn-main" onclick="startArms('triceps')">יד אחורית (Triceps)</button>
        </div>
    </div>

    <div id="ui-1rm" class="screen">
        <div class="header-nav">
            <button class="btn-icon" onclick="goBack()">➜</button>
            <h2 id="rm-title">קביעת משקל</h2>
        </div>
        <div class="rm-container">
            <p id="rm-exercise-name" class="highlight-text"></p>
            <p class="sub-text">הכנס משקל ל-RM<span id="rm-target"></span>:</p>
            
            <div class="picker-container">
                <button class="picker-btn" onclick="adjustRM(-2.5)">-</button>
                <div id="rm-value-display" class="picker-value">0</div>
                <button class="picker-btn" onclick="adjustRM(2.5)">+</button>
            </div>
            <div class="quick-select">
                <button class="tag" onclick="setSpecificRM(60)">60</button>
                <button class="tag" onclick="setSpecificRM(80)">80</button>
                <button class="tag" onclick="setSpecificRM(100)">100</button>
            </div>

            <button class="btn btn-main start-btn" onclick="confirmRM()">צור אימון</button>
        </div>
    </div>

    <div id="ui-active" class="screen">
        <div class="header-nav">
            <button class="btn-icon" onclick="handleActiveBack()">➜</button>
            <div class="progress-bar"><div id="progress-fill"></div></div>
        </div>
        
        <div class="exercise-card">
            <h2 id="ex-name">שם התרגיל</h2>
            <div class="set-info">
                <span>סט <span id="set-num">1</span> מתוך <span id="total-sets">3</span></span>
                <span class="rep-target" id="rep-target"></span>
            </div>
            
            <div class="picker-container">
                <button class="picker-btn" onclick="adjustWeight(-1.25)">-</button>
                <div id="weight-display" class="picker-value">0</div>
                <button class="picker-btn" onclick="adjustWeight(1.25)">+</button>
            </div>
            <p class="kg-label">ק"ג</p>

            <button class="btn btn-main" onclick="nextSet()">סיום סט</button>
        </div>

        <div class="interruption-area">
            <button class="btn-text" onclick="triggerInterruption()">+ תרגיל ביניים</button>
        </div>
    </div>

    <div id="ui-variation" class="screen">
        <div class="header-nav">
            <button class="btn-icon" onclick="goBack()">➜</button>
            <h2>בחירת תרגיל</h2>
        </div>
        <div id="variation-list" class="workout-list">
            </div>
    </div>

    <div id="ui-interrupt" class="screen">
         <div class="header-nav">
            <button class="btn-icon" onclick="closeInterruption()">X</button>
            <h2>תרגיל ביניים</h2>
        </div>
        <div id="interrupt-list" class="workout-list scrollable">
            </div>
    </div>

    <div id="ui-finish" class="screen">
        <h1>האימון הושלם! 🎉</h1>
        <div id="summary-text" class="summary-box"></div>
        <button class="btn btn-main" onclick="finishProcess()">העתק וסיים</button>
    </div>

    <div id="ui-history" class="screen">
        <div class="header-nav">
            <button class="btn-icon" onclick="goBackToHome()">➜</button>
            <h2>ארכיון אימונים</h2>
        </div>
        <div id="history-list" class="history-container">
            </div>
        <div id="history-detail-modal" class="modal hidden">
            <div class="modal-content">
                <h3 id="modal-date"></h3>
                <div id="modal-body" class="summary-box"></div>
                <div class="modal-actions">
                    <button class="btn btn-main" onclick="copyHistoryItem()">📋 העתק סיכום</button>
                    <button class="btn btn-danger" onclick="deleteHistoryItem()">🗑️ מחק מהארכיון</button>
                    <button class="btn btn-outline" onclick="closeModal()">סגור</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
